# Versions this repo on every merge to main (spec api#510, ticket api#515).
# Does nothing until the repo has a v* tag (api#516).
name: Versioning

on:
  push:
    branches: [ main ]

jobs:
  version:
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/versioning-reusable.yml
    with:
      repo_key: api
      # The scripts as of this commit, so a change to them versions itself.
      tools_ref: ${{ github.sha }}
    secrets:
      release_api_token: ${{ secrets.RPGCLUB_RELEASE_API_TOKEN }}
