# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # The GOTM / NR-GOTM round lifecycle (Voting::AdvanceRounds). A no-op until
  # VOTING_AUTOMATION_ENABLED=true, and then only queries Neon when
  # Voting::SweepSchedule says the round has something due.
  advance_voting_rounds:
    class: Voting::AdvanceRoundsJob
    queue: default
    schedule: every minute
  # The Challenges lifecycle (Challenges::Lifecycle): Seasons opening and
  # ending, end dates, reminder DMs. Only queries Neon when
  # Challenges::SweepSchedule says a step is due.
  challenges_lifecycle:
    class: Challenges::LifecycleJob
    queue: default
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Achievement Hub Sync Windows (ADR 0003): marks the Linked Accounts due
  # and starts the per-Provider ticks, which stop once everything is drained
  # so Neon can idle until the next window.
  achievement_sync_window:
    class: Achievements::SyncWindowJob
    queue: default
    schedule: "0 0,6,12,18 * * *"
  # The weekly IGDB refresh (api#393, ADR 0010): re-syncs the Releases of every
  # game with an upcoming, imprecise or missing date, so delayed games move on
  # the Release Calendar and their announcements move with them.
  weekly_release_refresh:
    class: Gamedb::ReleaseRefreshJob
    queue: default
    schedule: "0 5 * * 1"
  # The Daily Fun Fact (ticket #406): at 15:00 New York time, whatever the
  # season, draw the next Fun Fact and queue one daily_fun_fact bot job for
  # that club day. Skipped while the Club Codex is Off.
  daily_fun_fact:
    class: ClubCodex::DailyFunFactJob
    queue: default
    schedule: "0 15 * * * America/New_York"
  # The Birthday Post (ticket #401): at 10:00 New York time, whatever the
  # season, queue one birthday_post bot job greeting every member whose shared
  # Birthday it is that club day. One run a day, deliberately: a run missed
  # (API down or deploying at 10:00) is not retried, and those members are
  # greeted next year. Avoid deploying the API around 10:00 New York time.
  birthday_post:
    class: Birthdays::PostJob
    queue: default
    schedule: "0 10 * * * America/New_York"
