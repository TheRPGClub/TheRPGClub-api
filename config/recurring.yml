production:
  # The GOTM / NR-GOTM round lifecycle (Voting::AdvanceRounds). A no-op until
  # VOTING_AUTOMATION_ENABLED=true.
  advance_voting_rounds:
    class: Voting::AdvanceRoundsJob
    queue: default
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
